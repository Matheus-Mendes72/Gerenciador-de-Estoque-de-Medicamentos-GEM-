services:
  postgres:
    image: postgres:18
    container_name: gem-postgres-homolog
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${HOMOLOG_POSTGRES_DB}
      POSTGRES_USER: ${HOMOLOG_POSTGRES_USER}
      POSTGRES_PASSWORD: ${HOMOLOG_POSTGRES_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - gem_postgres_homolog_data:/var/lib/postgresql

volumes:
  gem_postgres_homolog_data: